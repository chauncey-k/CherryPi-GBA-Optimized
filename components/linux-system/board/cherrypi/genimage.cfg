image boot.vfat {
    vfat {
        extraargs = "-F 32 -n BOOT"
        files = {
            "zImage",
            "suniv-f1c100s-generic.dtb",
            "boot.scr"
        }
    }
    size = 64M
}
image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
    }
    partition u-boot {
        in-partition-table = "no"
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
    }
    partition boot {
        partition-type = 0x0c
        bootable = "true"
        image = "boot.vfat"
        offset = 1M
        size = 64M
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 256M
    }
}
